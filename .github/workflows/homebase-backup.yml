# HomeBase Backup: build the app (fork of KopiaUI) for Windows, macOS and Linux.
# Branches: homebase = official versions, dev = work in progress.
# - A tag v* on homebase: the installers are attached to the release (which HomeBaseOS uses as the download link).
# - A push to dev (or by hand): test builds as artifacts to download from the run (kept 14 days), never a release.
# The interface comes from the htmlui fork: branch dev for dev builds, otherwise homebase (see homebase/build-htmlui.sh).
name: HomeBase Backup
on:
  push:
    tags: ["v*"]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --x64 --arm64
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: kopia
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/htmlui
          ref: ${{ github.ref_name == 'dev' && 'dev' || 'homebase' }}
          path: htmlui
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: kopia/go.mod
          cache-dependency-path: kopia/go.sum

      - name: Releases only from homebase
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: kopia
        run: |
          git merge-base --is-ancestor HEAD origin/homebase \
            || { echo "::error::${GITHUB_REF_NAME} is not on homebase. Official releases come from homebase only; dev only gets test builds."; exit 1; }

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev.$(date +%Y%m%d%H%M)"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build the interface
        run: kopia/homebase/build-htmlui.sh "$GITHUB_WORKSPACE/htmlui"

      - name: Build Kopia
        working-directory: kopia
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          FLAGS="-s -w -X github.com/kopia/kopia/repo.BuildVersion=$V -X github.com/kopia/kopia/repo.BuildInfo=$(git rev-parse HEAD) -X github.com/kopia/kopia/repo.BuildGitHubRepo=$GITHUB_REPOSITORY"
          case "$RUNNER_OS" in
            macOS)
              GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o dist/kopia_darwin_amd64/kopia .
              GOARCH=arm64 go build -trimpath -ldflags "$FLAGS" -o dist/kopia_darwin_arm64/kopia .
              mkdir -p dist/kopia_darwin_universal
              lipo -create -output dist/kopia_darwin_universal/kopia dist/kopia_darwin_amd64/kopia dist/kopia_darwin_arm64/kopia ;;
            Windows)
              GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o dist/kopia_windows_amd64/kopia.exe . ;;
            Linux)
              GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$FLAGS" -o dist/kopia_linux_x64/kopia . ;;
          esac

      - name: Build the app
        working-directory: kopia/app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
          # Without these secrets the app is not signed (macOS and Windows then warn when installing).
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          # Only set CSC_LINK when there is a certificate: electron-builder reads an empty value as a path ("not a file").
          # Without a certificate on macOS: ad-hoc signing (otherwise Electron's signature no longer matches and macOS
          # reports "damaged"), and without the hardened runtime (only needed for notarisation by Apple).
          EXTRA=()
          if [ -n "$MAC_CERT_P12" ]; then
            export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          elif [ "$RUNNER_OS" = macOS ]; then
            EXTRA=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm ci --no-audit --no-fund
          npm version "$V" --no-git-tag-version --allow-same-version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUBLISH=always; else PUBLISH=never; fi
          npx electron-builder ${{ matrix.target }} "${EXTRA[@]}" --publish "$PUBLISH"

      - uses: actions/upload-artifact@v5
        with:
          name: homebase-backup-${{ github.ref_name == 'dev' && 'dev-' || '' }}${{ runner.os }}
          path: |
            kopia/dist/kopia-ui/*.exe
            kopia/dist/kopia-ui/*.dmg
            kopia/dist/kopia-ui/*.zip
            kopia/dist/kopia-ui/*.AppImage
            kopia/dist/kopia-ui/*.deb
          if-no-files-found: warn
          retention-days: 14
